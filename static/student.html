<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学生端 - 学生管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="brand-mark">学</div>
      <div>
        <div class="brand-name">学生管理系统</div>
        <div class="brand-sub">学生端</div>
      </div>
    </div>
    <div class="header-right">
      <span id="whoami"></span>
      <button class="btn ghost" id="myPwdBtn">修改密码</button>
      <button class="btn ghost" onclick="logout()">退出登录</button>
    </div>
  </header>

<main>
  <div class="card hero">
    <div class="hero-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/></svg>
    </div>
    <div>
      <div class="hero-title" id="welcome"></div>
      <div class="hero-sub">学生个人中心 · 查看信息与成绩</div>
    </div>
  </div>

  <div class="stu-grid">
    <div class="card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/></svg>
        我的信息
      </div>
      <div class="info-list">
        <div class="row"><span>学号</span><span id="iId"></span></div>
        <div class="row"><span>姓名</span><span id="iName"></span></div>
        <div class="row"><span>性别</span><span id="iGender"></span></div>
        <div class="row"><span>班级</span><span id="iClass"></span></div>
        <div class="row"><span>电话</span><span id="iPhone"></span></div>
      </div>
      <div style="padding:14px 18px;display:flex;gap:10px">
        <button class="btn student" id="requestBtn" style="flex:1;justify-content:center">申请修改信息</button>
        <button class="btn outline" id="myReqBtn" style="flex:1;justify-content:center">我的申请记录</button>
      </div>
      <div style="padding:0 18px 14px;font-size:12px;color:var(--ink-3)">修改需管理员审核通过后生效</div>
    </div>

    <div class="card">
      <div class="card-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>
        我的成绩
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>科目</th><th>分数</th></tr></thead>
          <tbody id="gradeBody"></tbody>
        </table>
      </div>
      <div class="summary" id="summary"></div>
    </div>
  </div>
</main>

  <!-- 申请修改信息 -->
  <dialog id="reqDialog">
    <h3>申请修改信息<button class="dlg-close" data-close title="关闭 (Esc)">&times;</button></h3>
    <div class="dialog-body">
      <div class="field">
        <label>选择修改项</label>
        <select id="reqField"></select>
      </div>
      <div class="field">
        <label>新的内容 *</label>
        <input id="reqValue">
      </div>
      <div class="actions">
        <button class="btn primary" id="submitReqBtn">提交申请</button>
        <button class="btn gray" id="cancelReqBtn">取消</button>
      </div>
    </div>
  </dialog>

  <!-- 我的申请记录 -->
  <dialog id="myReqDialog" class="wide">
    <h3>我的申请记录<button class="dlg-close" data-close title="关闭 (Esc)">&times;</button></h3>
    <div class="dialog-body">
      <div class="table-wrap">
        <table>
          <thead><tr><th>申请号</th><th>修改字段</th><th>原值</th><th>新值</th><th>状态</th><th>时间</th></tr></thead>
          <tbody id="myReqBody"></tbody>
        </table>
      </div>
      <div class="actions">
        <button class="btn gray" data-close>关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 修改密码 -->
  <dialog id="myPwdDialog">
    <h3>修改我的密码<button class="dlg-close" data-close title="关闭 (Esc)">&times;</button></h3>
    <div class="dialog-body">
      <div class="field"><label>旧密码 *</label><input id="oldPwd" type="password"></div>
      <div class="field"><label>新密码 *</label><input id="newPwd" type="password" placeholder="至少 4 位"></div>
      <div class="field"><label>确认新密码 *</label><input id="newPwd2" type="password"></div>
      <div class="actions">
        <button class="btn primary" id="saveMyPwdBtn">保存</button>
        <button class="btn gray" id="cancelMyPwdBtn">取消</button>
      </div>
    </div>
  </dialog>

  <script src="js/api.js"></script>
  <script src="js/student.js"></script>
</body>
</html>
