# 学生管理系统 - 容器编排（后端 + MySQL + Nginx 三容器）
# 启动：docker compose up -d     停止：docker compose down
# 首次启动会自动建库建表并写入默认种子数据

services:
  db:
    image: mysql:8.4
    container_name: sms-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: student_management
      MYSQL_USER: sms_app
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: .
    container_name: sms-backend
    env_file: .env            # 数据库密码与 SECRET 从独立配置文件注入
    environment:
      DB_HOST: db             # 容器网络内用服务名访问数据库（覆盖 .env 里的 127.0.0.1）
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"                # 只在容器网络内暴露，由 Nginx 对外

  nginx:
    image: nginx:alpine
    container_name: sms-nginx
    ports:
      - "80:80"               # 对外唯一入口
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/usr/share/nginx/html:ro   # 静态页面由 Nginx 直接提供
    depends_on:
      - backend

volumes:
  mysql_data:                 # 数据库数据持久化，容器删除数据不丢
